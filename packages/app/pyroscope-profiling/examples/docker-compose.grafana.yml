# Overlay that adds Grafana, for the times a flame graph in a browser beats
# `pyroscope-analyze` in a terminal: comparing two runs frame by frame, or
# following a trace into the profile taken during it. Needs the base file:
#
#   docker compose -f docker-compose.pyroscope.yml -f docker-compose.grafana.yml up -d
#
# Grafana is then on http://localhost:3000 with the Pyroscope datasource
# provisioned and anonymous admin access, so there is no login step. Pyroscope's
# own UI is on http://localhost:4040 either way.
services:
  grafana:
    image: grafana/grafana:12.3.1
    # Loopback only, like Pyroscope: anonymous access at the Admin role is
    # something to hand to this machine and to nothing else on the network.
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_FEATURE_TOGGLES_ENABLE: traceToProfiles
    # Mounted file by file rather than as a directory, so the tracing overlay
    # can add one more datasource next to this one. A file mount nested inside a
    # read-only directory mount is refused by the container runtime.
    volumes:
      - ./grafana/pyroscope-datasource.yml:/etc/grafana/provisioning/datasources/pyroscope.yml:ro
    depends_on:
      - pyroscope
