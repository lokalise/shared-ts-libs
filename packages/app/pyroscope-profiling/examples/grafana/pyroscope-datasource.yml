apiVersion: 1

datasources:
  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    # Service name inside the compose network, not localhost: Grafana reaches
    # Pyroscope container to container, while the profiled service reaches the
    # published port.
    url: http://pyroscope:4040
    isDefault: true
    jsonData:
      minStep: 15s
